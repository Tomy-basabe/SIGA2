<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.A. - Sistema Integral de Gestion Academica</title>
    <meta name="description" content="Organiza tu vida universitaria: materias, examenes, apuntes y horarios de consulta en un solo lugar.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>

    <!-- ========== LOGIN ========== -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo-container" style="background: #ffffff; padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px; display: inline-block; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
                <img src="logo.png" alt="S.I.G.A. Logo" style="width: 100%; max-width: 280px; height: auto; display: block;">
            </div>
            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label for="login-email">Correo electronico</label>
                    <input type="email" id="login-email" placeholder="tu@email.edu.ar" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="material-symbols-outlined">login</span>
                    Ingresar
                </button>
                <p class="login-error" id="login-error"></p>
                <p style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">
                    Demo: <strong style="color:var(--accent-light);cursor:pointer;" onclick="document.getElementById('login-email').value='alumno@utn.edu.ar'">alumno@utn.edu.ar</strong>
                </p>
            </form>
        </div>
    </div>

    <!-- ========== MOBILE HEADER ========== -->
    <div class="mobile-header" id="mobile-header">
        <button class="hamburger" id="hamburger-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="mobile-logo">S.I.G.A.</span>
        <span style="width:36px"></span>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ========== APP SHELL ========== -->
    <div id="app-shell" class="app-shell hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-logo" style="padding: 6px 12px; margin-bottom: 16px; background: #ffffff; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; height: 50px;">
                <img src="logo.png" alt="S.I.G.A." style="max-height: 100%; max-width: 100%; object-fit: contain;">
            </div>
            <div class="sidebar-user" id="sidebar-user"></div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <button class="nav-item active" data-view="dashboard">
                    <span class="material-symbols-outlined">dashboard</span> Dashboard
                </button>
                <button class="nav-item" data-view="plan">
                    <span class="material-symbols-outlined">school</span> Plan de Carrera
                </button>
                <button class="nav-item" data-view="materias">
                    <span class="material-symbols-outlined">menu_book</span> Mis Materias
                </button>
                <button class="nav-item" data-view="examenes">
                    <span class="material-symbols-outlined">event</span> Examenes
                </button>
                <button class="nav-item" data-view="apuntes">
                    <span class="material-symbols-outlined">description</span> Mis Apuntes
                </button>
                <button class="nav-item" data-view="profesores">
                    <span class="material-symbols-outlined">groups</span> Profesores
                </button>
                <div class="nav-divider"></div>
                <button class="nav-item nav-item-logout" id="btn-logout">
                    <span class="material-symbols-outlined">logout</span> Cerrar Sesion
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content"></main>
    </div>

    <!-- ========== MODAL ========== -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- ========== TOASTS ========== -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
